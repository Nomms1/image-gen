<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Studio Nexus · Ultimate AI Pipeline</title>
  <style>
    :root {
      --bg: #050507;
      --card: #0e0e12;
      --border: #21212c;
      --text: #f4f4f6;
      --muted: #8b8b9e;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --ring: rgba(99, 102, 241, 0.25);
    }
    body.light {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
      --muted: #4b5563;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --ring: rgba(79, 70, 229, 0.2);
    }
    body.anima {
      --bg: #06030d;
      --card: #0f081c;
      --border: #261642;
      --text: #f3e8ff;
      --muted: #a78bfa;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --ring: rgba(168, 85, 247, 0.3);
    }
    body.anima.light {
      --bg: #faf5ff;
      --card: #ffffff;
      --border: #e9d5ff;
      --text: #3b0764;
      --muted: #7e22ce;
      --accent: #9333ea;
      --accent-hover: #7e22ce;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: inherit; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* Top Navigation Bar */
    .top-bar {
      position: fixed; top: 16px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100; pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .nav-group { display: flex; gap: 10px; align-items: center; }
    
    button, select, input {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer;
      transition: all 0.2s ease; outline: none;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: scale(0.98); }

    .status-pill {
      display: flex; align-items: center; gap: 8px; background: var(--card);
      border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px;
      font-size: 0.75rem; color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .dot.online { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.5); }

    /* Main Container */
    .container { width: 100%; max-width: 800px; margin-top: 50px; }
    
    .panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      padding: 32px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
      margin-bottom: 24px;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 28px; }

    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    textarea, input[type="text"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 0.95rem;
      resize: vertical; margin-bottom: 16px;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    textarea { min-height: 110px; }

    .row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .row > * { flex: 1; }

    .pill-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 500;
      text-align: center; cursor: pointer; flex: 1;
    }
    .pill-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Sliders & Controls */
    .slider-group { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    /* Action Button */
    .btn-primary {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Progress & Status */
    .status-text { font-size: 0.85rem; color: var(--muted); margin-top: 14px; text-align: center; min-height: 1.2em; }
    .progress-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }

    /* Gallery Grid */
    .gallery { display: none; margin-top: 24px; }
    .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .gallery-item { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
    .gallery-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; cursor: pointer; }
    .gallery-actions { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px; }
    .gallery-actions button { background: rgba(0,0,0,0.7); border: none; color: #fff; padding: 4px 8px; font-size: 0.7rem; border-radius: 6px; }

    /* Modal Wrapper */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 440px; padding: 24px; }
    
    /* Lightbox */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }
  </style>
</head>
<body>

  <!-- Top Navigation Control Bar -->
  <div class="top-bar">
    <div class="nav-group">
      <button onclick="toggleTheme()">Theme</button>
      <button onclick="openSettingsModal()">⚙️ Server Setup</button>
    </div>
    <div class="status-pill">
      <div class="dot" id="connectionDot"></div>
      <span id="connectionText">Checking connection...</span>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <h1>Gemini Studio Nexus</h1>
      <p class="subtitle">Complete client-side ComfyUI control matrix with absolute backend control.</p>

      <label>Prompt Description</label>
      <textarea id="promptInput" placeholder="An epic cinematic shot of a futuristic metropolis, volumetric lighting, high detail..."></textarea>

      <div class="row">
        <button class="pill-btn" onclick="surprisePrompt()">🎲 Randomize Prompt</button>
        <button class="pill-btn" onclick="toggleNegativeBox()">+ Negative Prompt</button>
      </div>

      <div id="negativeContainer" style="display:none; margin-bottom: 16px;">
        <label>Negative Prompt</label>
        <textarea id="negativeInput" placeholder="blurry, low quality, artifacts, watermark..." style="min-height: 60px;"></textarea>
      </div>

      <label>Engine Backend Model</label>
      <div class="row" id="engineSelection">
        <button class="pill-btn active" data-engine="krea" onclick="setEngine('krea')">Krea Turbo</button>
        <button class="pill-btn" data-engine="anima" onclick="setEngine('anima')">Anima Studio</button>
      </div>

      <label>LoRA Extension Module</label>
      <div class="row">
        <select id="loraSelect" style="flex: 2;">
          <option value="none">None (Bypassed)</option>
          <option value="add_detail.safetensors">Add Details / High Fidelity</option>
          <option value="cyberpunk_style.safetensors">Cyberpunk Atmospheric Vibe</option>
        </select>
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <label style="margin:0;">LoRA Injection Weight</label>
          <span id="weightVal" style="color: var(--text); font-weight: 600;">0.80</span>
        </div>
        <input type="range" id="loraWeight" min="0" max="1" step="0.05" value="0.8">
      </div>

      <label>Aspect Ratio Configuration</label>
      <div class="row" id="ratioSelection">
        <button class="pill-btn active" data-ratio="1:1" onclick="setRatio('1:1')">1:1 Square</button>
        <button class="pill-btn" data-ratio="16:9" onclick="setRatio('16:9')">16:9 Widescreen</button>
        <button class="pill-btn" data-ratio="9:16" onclick="setRatio('9:16')">9:16 Portrait</button>
      </div>

      <div style="margin-top: 24px;">
        <button class="btn-primary" id="generateBtn" onclick="startGeneration()">Execute Generation Pipeline</button>
      </div>

      <div class="status-text" id="statusText">System standing by.</div>
      <div class="progress-bar-wrap" id="progressBarWrap">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <!-- Gallery Output Section -->
    <div class="gallery" id="gallerySection">
      <div class="gallery-header">
        <label>Generated Gallery Output</label>
        <button onclick="clearGallery()">Purge Gallery</button>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </div>

  <!-- Server Configuration Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2 style="font-size: 1.2rem; margin-bottom: 12px;">ComfyUI Host Configuration</h2>
      <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 16px;">Set your active local node or remote tunnel endpoint.</p>
      <label>Server Endpoint URL</label>
      <input type="text" id="serverUrlInput" placeholder="http://127.0.0.1:8188">
      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button onclick="closeSettingsModal()">Cancel</button>
        <button class="pill-btn active" onclick="saveServerSettings()">Save & Reconnect</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="">
  </div>

  <script>
    // --- State Management ---
    let serverAddress = localStorage.getItem("comfy_server") || "http://127.0.0.1:8188";
    let currentEngine = "krea";
    let currentRatio = "1:1";
    let activeClientId = "nexus_" + Math.random().toString(36).substring(2, 9);
    let galleryItems = [];
    let activeWs = null;

    const dimensionsMap = {
      "1:1": [1024, 1024],
      "16:9": [1344, 768],
      "9:16": [768, 1344]
    };

    const surprisePool = [
      "An intricate crystal cathedral floating in the clouds during an aurora borealis",
      "A cyberpunk street market glowing with holographic advertisements in deep twilight",
      "An ethereal forest spirit carved out of ancient amber wood and glowing moss",
      "A sleek futuristic starcruiser docking inside a massive orbital space station ring"
    ];

    // Live UI updates for sliders
    document.getElementById("loraWeight").addEventListener("input", (e) => {
      document.getElementById("weightVal").textContent = parseFloat(e.target.value).toFixed(2);
    });

    // Theme Handlers
    function toggleTheme() {
      const isLight = document.body.classList.toggle("light");
      localStorage.setItem("theme", isLight ? "light" : "dark");
    }
    if (localStorage.getItem("theme") === "light") document.body.classList.add("light");

    function setEngine(engine) {
      currentEngine = engine;
      document.querySelectorAll("#engineSelection .pill-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.engine === engine);
      });
      document.body.classList.toggle("anima", engine === "anima");
    }

    function setRatio(ratio) {
      currentRatio = ratio;
      document.querySelectorAll("#ratioSelection .pill-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.ratio === ratio);
      });
    }

    function toggleNegativeBox() {
      const box = document.getElementById("negativeContainer");
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    function surprisePrompt() {
      document.getElementById("promptInput").value = surprisePool[Math.floor(Math.random() * surprisePool.length)];
    }

    function openSettingsModal() {
      document.getElementById("serverUrlInput").value = serverAddress;
      document.getElementById("settingsModal").classList.add("open");
    }
    function closeSettingsModal() {
      document.getElementById("settingsModal").classList.remove("open");
    }
    function saveServerSettings() {
      const val = document.getElementById("serverUrlInput").value.trim();
      if (val) {
        serverAddress = val.replace(/\/+$/, "");
        localStorage.setItem("comfy_server", serverAddress);
        checkServerStatus();
      }
      closeSettingsModal();
    }

    // --- Connectivity Watcher ---
    async function checkServerStatus() {
      const dot = document.getElementById("connectionDot");
      const text = document.getElementById("connectionText");
      try {
        const res = await fetch(`${serverAddress}/queue`, { method: "GET", cache: "no-store" });
        if (!res.ok) throw new Error();
        dot.className = "dot online";
        text.textContent = "Pipeline Online";
      } catch (e) {
        dot.className = "dot";
        text.textContent = "Node Offline / Check URL";
      }
    }
    checkServerStatus();
    setInterval(checkServerStatus, 10000);

    // --- Core Generation Engine ---
    async function startGeneration() {
      const promptText = document.getElementById("promptInput").value.trim();
      if (!promptText) {
        alert("Please provide a prompt description.");
        return;
      }

      const generateBtn = document.getElementById("generateBtn");
      const statusText = document.getElementById("statusText");
      const progressBarWrap = document.getElementById("progressBarWrap");
      const progressBarFill = document.getElementById("progressBarFill");

      generateBtn.disabled = true;
      statusText.textContent = "Compiling ComfyUI pipeline JSON...";
      progressBarWrap.style.display = "block";
      progressBarFill.style.width = "10%";

      const [width, height] = dimensionsMap[currentRatio];
      const seedVal = Math.floor(Math.random() * 1e15);
      const selectedLora = document.getElementById("loraSelect").value;
      const loraWeight = parseFloat(document.getElementById("loraWeight").value);

      // Modular node definition map
      let modelOutputNode = ["1", 0];
      let clipOutputNode = ["2", 0];
      
      let workflowNodes = {
        "1": { inputs: { unet_name: currentEngine === "anima" ? "animaMayhem_v10.safetensors" : "v1-5-pruned-emaonly.safetensors", weight_dtype: "default" }, class_type: "UNETLoader" },
        "2": { inputs: { clip_name: "clip_l.safetensors", type: "stable_diffusion", device: "default" }, class_type: "CLIPLoader" },
        "5": { inputs: { width: width, height: height, batch_size: 1 }, class_type: "EmptyLatentImage" },
        "6": { inputs: { text: promptText, clip: clipOutputNode }, class_type: "CLIPTextEncode" },
        "7": { inputs: { text: document.getElementById("negativeInput").value || "blurry, low quality, artifacts", clip: clipOutputNode }, class_type: "CLIPTextEncode" },
        "4": { inputs: { vae_name: "ae.safetensors" }, class_type: "VAELoader" },
        "8": { inputs: { samples: ["3", 0], vae: ["4", 0] }, class_type: "VAEDecode" },
        "9": { inputs: { filename_prefix: "GeminiStudioNexus", images: ["8", 0] }, class_type: "SaveImage" }
      };

      // Inject LoRA wrapper node if active
      if (selectedLora !== "none") {
        workflowNodes["10"] = {
          inputs: { strength_model: loraWeight, strength_clip: loraWeight, lora_name: selectedLora, model: ["1", 0], clip: ["2", 0] },
          class_type: "LoraLoader"
        };
        modelOutputNode = ["10", 0];
        clipOutputNode = ["10", 1];
        workflowNodes["6"].inputs.clip = clipOutputNode;
        workflowNodes["7"].inputs.clip = clipOutputNode;
      }

      workflowNodes["3"] = {
        inputs: { seed: seedVal, steps: 20, cfg: 7.5, sampler_name: "euler", scheduler: "normal", denoise: 1, model: modelOutputNode, positive: ["6", 0], negative: ["7", 0], latent_image: ["5", 0] },
        class_type: "KSampler"
      };

      try {
        statusText.textContent = "Transmitting job payload to active server...";
        progressBarFill.style.width = "35%";

        const response = await fetch(`${serverAddress}/prompt`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: workflowNodes, client_id: activeClientId })
        });

        if (!response.ok) throw new Error(await response.text());
        const data = await response.json();
        
        trackJobExecution(data.prompt_id, seedVal, promptText);
      } catch (err) {
        statusText.textContent = "Error: Transmission rejected by server.";
        progressBarWrap.style.display = "none";
        generateBtn.disabled = false;
      }
    }

    function trackJobExecution(promptId, seed, promptText) {
      const wsUrl = serverAddress.replace("https://", "wss://").replace("http://", "ws://");
      if (activeWs) activeWs.close();

      activeWs = new WebSocket(`${wsUrl}/ws?clientId=${activeClientId}`);

      activeWs.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "progress") {
            const pct = Math.round((msg.data.value / msg.data.max) * 50) + 35;
            document.getElementById("progressBarFill").style.width = `${pct}%`;
            document.getElementById("statusText").textContent = `Processing sampling step ${msg.data.value}/${msg.data.max}...`;
          }
          if (msg.type === "executing" && msg.data.node === null && msg.data.prompt_id === promptId) {
            fetchOutputHistory(promptId, seed, promptText);
          }
        } catch (e) {}
      };
    }

    async function fetchOutputHistory(promptId, seed, promptText) {
      try {
        const res = await fetch(`${serverAddress}/history/${promptId}`);
        const history = await res.json();
        const entry = history[promptId];
        
        if (entry && entry.outputs) {
          for (const nodeKey of Object.keys(entry.outputs)) {
            const images = entry.outputs[nodeKey].images;
            if (images && images.length > 0) {
              const imgInfo = images[0];
              const imageUrl = `${serverAddress}/view?filename=${encodeURIComponent(imgInfo.filename)}&subfolder=${encodeURIComponent(imgInfo.subfolder || "")}&type=${imgInfo.type || "output"}`;
              
              galleryItems.unshift({ url: imageUrl, seed, prompt: promptText });
              renderGallery();
            }
          }
        }
      } catch (e) {}

      document.getElementById("progressBarFill").style.width = "100%";
      document.getElementById("statusText").textContent = "Generation complete.";
      document.getElementById("generateBtn").disabled = false;
      setTimeout(() => { document.getElementById("progressBarWrap").style.display = "none"; }, 1000);
    }

    // --- Gallery Management ---
    function renderGallery() {
      const section = document.getElementById("gallerySection");
      const grid = document.getElementById("galleryGrid");
      section.style.display = "block";
      grid.innerHTML = "";

      galleryItems.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "gallery-item";
        card.innerHTML = `
          <img src="${item.url}" onclick="openLightbox('${item.url}')">
          <div class="gallery-actions">
            <button onclick="downloadImage('${item.url}')">Download</button>
            <button onclick="deleteGalleryItem(${index})">✕</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function deleteGalleryItem(index) {
      galleryItems.splice(index, 1);
      if (galleryItems.length === 0) document.getElementById("gallerySection").style.display = "none";
      else renderGallery();
    }

    function clearGallery() {
      galleryItems = [];
      document.getElementById("gallerySection").style.display = "none";
    }

    async function downloadImage(url) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "nexus_generated.png";
        a.click();
      } catch (e) {
        window.open(url, "_blank");
      }
    }

    function openLightbox(url) {
      document.getElementById("lightboxImg").src = url;
      document.getElementById("lightbox").classList.add("open");
    }
    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
    }
  </script>
</body>
</html>

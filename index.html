<!DOCTYPE html>
<html lang="en" class="dark">

  <meta charset="UTF-8">

  <style>
    :root {
      --bg: #050507;
      --card: #0e0e12;
      --border: #21212c;
      --text: #f4f4f6;
      --muted: #8b8b9e;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --ring: rgba(99, 102, 241, 0.25);
    }
    body.light {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d1d5db;
      --text: #111827;
      --muted: #4b5563;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --ring: rgba(79, 70, 229, 0.2);
    }
    body.anima {
      --bg: #06030d;
      --card: #0f081c;
      --border: #261642;
      --text: #f3e8ff;
      --muted: #a78bfa;
      --accent: #a855f7;
      --accent-hover: #9333ea;
      --ring: rgba(168, 85, 247, 0.3);
    }
    body.anima.light {
      --bg: #faf5ff;
      --card: #ffffff;
      --border: #e9d5ff;
      --text: #3b0764;
      --muted: #7e22ce;
      --accent: #9333ea;
      --accent-hover: #7e22ce;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: inherit; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .top-bar {
      position: fixed; top: 16px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100; pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .nav-group { display: flex; gap: 10px; align-items: center; }
    
    button, select, input {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer;
      transition: all 0.2s ease; outline: none;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: scale(0.98); }

    .status-pill {
      display: flex; align-items: center; gap: 8px; background: var(--card);
      border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px;
      font-size: 0.75rem; color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .dot.online { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.5); }

    .container { width: 100%; max-width: 800px; margin-top: 50px; }
    
    .panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      padding: 32px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4);
      margin-bottom: 24px;
    }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.85rem; color: var(--muted); margin-bottom: 28px; }

    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    textarea, input[type="text"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px; color: var(--text); font-size: 0.95rem;
      resize: vertical; margin-bottom: 16px;
    }
    textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
    textarea { min-height: 110px; }

    .row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .row > * { flex: 1; }

    .pill-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; font-weight: 500;
      text-align: center; cursor: pointer; flex: 1;
    }
    .pill-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .slider-group { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    .dropzone {
      border: 2px dashed var(--border); border-radius: 12px; padding: 20px;
      text-align: center; background: var(--bg); color: var(--muted); font-size: 0.85rem;
      cursor: pointer; margin-bottom: 16px; transition: border-color 0.2s;
    }
    .dropzone:hover { border-color: var(--accent); }

    .btn-primary {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 12px; padding: 14px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-text { font-size: 0.85rem; color: var(--muted); margin-top: 14px; text-align: center; min-height: 1.2em; }
    .progress-bar-wrap { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }

    .gallery { display: none; margin-top: 24px; }
    .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .gallery-item { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
    .gallery-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; cursor: pointer; }
    .gallery-actions { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px; }
    .gallery-actions button { background: rgba(0,0,0,0.7); border: none; color: #fff; padding: 4px 8px; font-size: 0.7rem; border-radius: 6px; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;

    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 440px; padding: 24px; }
    
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }
  </style>
</head>

        formData.append("image", file);
        formData.append("overwrite", "true");

        document.getElementById("statusText").textContent = "Uploading source image to server...";

          const res = await fetch(`${serverAddress}/upload/image`, {
            method: "POST",
            body: formData
          });

        } catch (e) {
          alert("Failed to upload image to ComfyUI host. Check connection.");

      document.getElementById("uploadLabel").style.display = "block";
      document.getElementById("imagePreviewContainer").style.display = "none";
      document.getElementById("statusText").textContent = "Switched back to Text-to-Image mode.";
    }

    async function checkServerStatus() {
      const dot = document.getElementById("connectionDot");
      const text = document.getElementById("connectionText");
      try {
        const res = await fetch(`${serverAddress}/queue`, { method: "GET", cache: "no-store" });
        if (!res.ok) throw new Error();
        dot.className = "dot online";
        text.textContent = "Pipeline Online";
      } catch (e) {
        dot.className = "dot";
        text.textContent = "Node Offline / Check URL";
      }
    }
    checkServerStatus();
    setInterval(checkServerStatus, 10000);
    populateLoraDropdown();

    async function startGeneration() {
      const promptText = document.getElementById("promptInput").value.trim();
      if (!promptText) {
        alert("Please provide a prompt description.");
        return;
      }

      const generateBtn = document.getElementById("generateBtn");
      const statusText = document.getElementById("statusText");
      const progressBarWrap = document.getElementById("progressBarWrap");
      const progressBarFill = document.getElementById("progressBarFill");

      generateBtn.disabled = true;
      statusText.textContent = "Constructing native pipeline execution graph...";
      progressBarWrap.style.display = "block";
      progressBarFill.style.width = "10%";

      const [width, height] = dimensionsMap[currentRatio];
      const seedVal = Math.floor(Math.random() * 1e15);
      const selectedLora = document.getElementById("loraSelect").value;
      const loraWeight = parseFloat(document.getElementById("loraWeight").value);
      const negText = document.getElementById("negativeInput").value || "worst quality, low quality, blurry";

      let workflowNodes = {};

      if (currentEngine === "anima") {
        // Anima High-Performance Pipeline Blueprint
        workflowNodes = {
          "295": { inputs: { unet_name: "animaMayhem_v10.safetensors", weight_dtype: "default" }, class_type: "UNETLoader" },
          "296": { inputs: { clip_name: "qwen_3_06b_base.safetensors", type: "stable_diffusion", device: "default" }, class_type: "CLIPLoader" },
          "297": { inputs: { vae_name: "qwen_image_vae.safetensors" }, class_type: "VAELoader" },
          "114": { inputs: { seed: seedVal }, class_type: "Seed (rgthree)" },
          "5": { inputs: { text: promptText, clip: selectedLora !== "none" ? ["226", 1] : ["296", 0] }, class_type: "CLIPTextEncode" },
          "7": { inputs: { text: negText, clip: selectedLora !== "none" ? ["226", 1] : ["296", 0] }, class_type: "CLIPTextEncode" },
          "29": { inputs: { any_01: ["297", 0] }, class_type: "Any Switch (rgthree)" },
          "41": {
            inputs: {
              filename: "%time_%basemodelname_%seed", path: "AnimaStudio", extension: "png",
              steps: 12, cfg: 1, modelname: "animaMayhem_v10.safetensors", sampler_name: "euler",
              scheduler_name: "normal", positive: ["5", 0], negative: ["7", 0], seed_value: ["114", 0],
              width: width, height: height, lossless_webp: true, quality_jpeg_or_webp: 100,
              optimize_png: false, counter: 0, denoise: 1, clip_skip: 0, time_format: "%Y-%m-%d-%H%M%S",
              save_workflow_as_json: false, embed_workflow: false, additional_hashes: "",
              download_civitai_data: false, easy_remix: true, show_preview: true, custom: "",
              images: ["100", 0]
            },
            class_type: "Image Saver"
          }
        };

        let baseModelNode = ["295", 0];
        let baseClipNode = ["296", 0];

        // LoRA Loader injection for Anima
        if (selectedLora !== "none") {
          workflowNodes["226"] = {
            inputs: {
              PowerLoraLoaderHeaderWidget: { type: "PowerLoraLoaderHeaderWidget" },
              lora_1: { on: true, lora: selectedLora, strength: loraWeight },
              "➕ Add Lora": "",
              model: baseModelNode,
              clip: baseClipNode
            },
            class_type: "Power Lora Loader (rgthree)"
          };
          baseModelNode = ["226", 0];
        }

        if (uploadedImageName) {
          // Img2Img setup branch
          workflowNodes["118"] = { inputs: { image: uploadedImageName, upload: "image" }, class_type: "LoadImage" };
          workflowNodes["119"] = { inputs: { pixels: ["118", 0], vae: ["29", 0] }, class_type: "VAEEncode" };
          workflowNodes["207"] = {
            inputs: {
              add_noise: "enable", noise_seed: ["114", 0], steps: 12, cfg: 1,
              sampler_name: "euler", scheduler: "normal", start_at_step: 0, end_at_step: 10000,
              return_with_leftover_noise: "disable", model: baseModelNode, positive: ["5", 0],
              negative: ["7", 0], latent_image: ["119", 0]
            },
            class_type: "KSamplerAdvanced"
          };
        } else {
          // T2I setup branch
          workflowNodes["97"] = { inputs: { width: width, height: height, batch_size: 1 }, class_type: "EmptyLatentImage" };
          workflowNodes["207"] = {
            inputs: {
              add_noise: "enable", noise_seed: ["114", 0], steps: 12, cfg: 1,
              sampler_name: "euler", scheduler: "normal", start_at_step: 0, end_at_step: 10000,
              return_with_leftover_noise: "disable", model: baseModelNode, positive: ["5", 0],
              negative: ["7", 0], latent_image: ["97", 0]
            },
            class_type: "KSamplerAdvanced"
          };
        }

        workflowNodes["100"] = { inputs: { samples: ["207", 0], vae: ["29", 0] }, class_type: "VAEDecode" };

      } else {
        // Krea Turbo Pipeline Blueprint
        workflowNodes = {
          "1": { inputs: { unet_name: "DasiwaKrea2TurboRaw_cutedisasterV2Turbo.safetensors", weight_dtype: "default" }, class_type: "UNETLoader" },
          "3": { inputs: { clip_name: "qwen3vl_4b_fp8_scaled.safetensors", type: "krea2", device: "default" }, class_type: "CLIPLoader" },
          "16": { inputs: { vae_name: "krea2RealVae_v10.safetensors" }, class_type: "VAELoader" },
          "12": { inputs: { seed: seedVal }, class_type: "Seed (rgthree)" },
          "123:8": { inputs: { text: promptText, clip: selectedLora !== "none" ? ["30", 1] : ["3", 0] }, class_type: "CLIPTextEncode" },
          "123:29": { inputs: { conditioning: ["123:8", 0] }, class_type: "ConditioningZeroOut" }
        };

        let activeKreaModel = ["1", 0];
        if (selectedLora !== "none") {
          workflowNodes["30"] = {
            inputs: {
              PowerLoraLoaderHeaderWidget: { type: "PowerLoraLoaderHeaderWidget" },
              lora_1: { on: true, lora: selectedLora, strength: loraWeight },
              "➕ Add Lora": "",
              model: ["1", 0],
              clip: ["3", 0]
            },
            class_type: "Power Lora Loader (rgthree)"
          };
          activeKreaModel = ["30", 0];
        }

        if (uploadedImageName) {
          // Img2Img path for Krea
          workflowNodes["img_load"] = { inputs: { image: uploadedImageName, upload: "image" }, class_type: "LoadImage" };
          workflowNodes["img_enc"] = { inputs: { pixels: ["img_load", 0], vae: ["16", 0] }, class_type: "VAEEncode" };
          workflowNodes["123:6"] = {
            inputs: {
              seed: ["12", 0], steps: 8, cfg: 1, sampler_name: "euler", scheduler: "linear_quadratic",
              denoise: 0.75, model: activeKreaModel, positive: ["123:8", 0], negative: ["123:29", 0], latent_image: ["img_enc", 0]
            },
            class_type: "KSampler"
          };
        } else {
          // T2I path for Krea
          workflowNodes["11"] = { inputs: { width: width, height: height, batch_size: 1 }, class_type: "EmptyLatentImage" };
          workflowNodes["123:6"] = {
            inputs: {
              seed: ["12", 0], steps: 8, cfg: 1, sampler_name: "euler", scheduler: "linear_quadratic",
              denoise: 1, model: activeKreaModel, positive: ["123:8", 0], negative: ["123:29", 0], latent_image: ["11", 0]
            },
            class_type: "KSampler"
          };
        }

        workflowNodes["123:102"] = { inputs: { samples: ["123:6", 0], vae: ["16", 0] }, class_type: "VAEDecode" };
        workflowNodes["212"] = {
          inputs: {
            filename: "%time_%basemodelname_%seed", path: "KreaStudio", extension: "png",
            lossless_webp: true, quality_jpeg_or_webp: 100, optimize_png: false, embed_workflow: true,
            save_workflow_as_json: false, counter: 0, time_format: "%Y-%m-%d-%H%M%S", show_preview: false,
            images: ["123:102", 0],
            metadata: {
              modelname: "Kreav2(new)", positive: promptText, negative: negText,
              width: width, height: height, seed_value: seedVal, steps: 8, cfg: 1,
              sampler_name: "euler", scheduler_name: "normal", denoise: 1, clip_skip: 0,
              additional_hashes: "", download_civitai_data: true, easy_remix: true, custom: ""
            }
          },
          class_type: "Image Saver Simple"
        };
      }

      try {
        statusText.textContent = "Transmitting job payload to active server...";
        progressBarFill.style.width = "35%";

        const response = await fetch(`${serverAddress}/prompt`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: workflowNodes, client_id: activeClientId })
        });

        if (!response.ok) throw new Error(await response.text());
        const data = await response.json();
        
        trackJobExecution(data.prompt_id, seedVal, promptText);
      } catch (err) {
        statusText.textContent = "Error: Transmission rejected by server.";
        progressBarWrap.style.display = "none";
        generateBtn.disabled = false;
      }
    }

    function trackJobExecution(promptId, seed, promptText) {
      const wsUrl = serverAddress.replace("https://", "wss://").replace("http://", "ws://");
      if (activeWs) activeWs.close();

      activeWs = new WebSocket(`${wsUrl}/ws?clientId=${activeClientId}`);

      activeWs.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === "progress") {
            const pct = Math.round((msg.data.value / msg.data.max) * 50) + 35;
            document.getElementById("progressBarFill").style.width = `${pct}%`;
            document.getElementById("statusText").textContent = `Processing sampling step ${msg.data.value}/${msg.data.max}...`;
          }
          if (msg.type === "executing" && msg.data.node === null && msg.data.prompt_id === promptId) {
            fetchOutputHistory(promptId, seed, promptText);
          }
        } catch (e) {}
      };
    }

    async function fetchOutputHistory(promptId, seed, promptText) {
      try {
        const res = await fetch(`${serverAddress}/history/${promptId}`);
        const history = await res.json();
        const entry = history[promptId];
        
        if (entry && entry.outputs) {
          for (const nodeKey of Object.keys(entry.outputs)) {
            const images = entry.outputs[nodeKey].images;
            if (images && images.length > 0) {
              const imgInfo = images[0];
              const imageUrl = `${serverAddress}/view?filename=${encodeURIComponent(imgInfo.filename)}&subfolder=${encodeURIComponent(imgInfo.subfolder || "")}&type=${imgInfo.type || "output"}`;
              
              galleryItems.unshift({ url: imageUrl, seed, prompt: promptText });
              renderGallery();
            }
          }
        }
      } catch (e) {}

      document.getElementById("progressBarFill").style.width = "100%";
      document.getElementById("statusText").textContent = "Generation complete.";
      document.getElementById("generateBtn").disabled = false;
      setTimeout(() => { document.getElementById("progressBarWrap").style.display = "none"; }, 1000);
    }

    function renderGallery() {
      const section = document.getElementById("gallerySection");
      const grid = document.getElementById("galleryGrid");
      section.style.display = "block";
      grid.innerHTML = "";

      galleryItems.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "gallery-item";
        card.innerHTML = `
          <img src="${item.url}" onclick="openLightbox('${item.url}')">
          <div class="gallery-actions">
            <button onclick="downloadImage('${item.url}')">Download</button>
            <button onclick="deleteGalleryItem(${index})">✕</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function deleteGalleryItem(index) {
      galleryItems.splice(index, 1);
      if (galleryItems.length === 0) document.getElementById("gallerySection").style.display = "none";
      else renderGallery();
    }

    function clearGallery() {
      galleryItems = [];
      document.getElementById("gallerySection").style.display = "none";
    }

    async function downloadImage(url) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "nexus_generated.png";
        a.click();
      } catch (e) {
        window.open(url, "_blank");
      }
    }

    function openLightbox(url) {
      document.getElementById("lightboxImg").src = url;
      document.getElementById("lightbox").classList.add("open");
    }
    function closeLightbox() {
      document.getElementById("lightbox.open")?.classList.remove("open");
      document.getElementById("lightbox").classList.remove("open");
    }
  </script>
</body>
</html>
